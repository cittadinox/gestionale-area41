<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Area41</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN -->
    <div id="loginBox" class="login-box">

        <h2>Accesso Gestionale</h2>

        <input type="text" id="loginUsername" placeholder="Username">

        <input type="password" id="loginPassword" placeholder="Password">

        <button onclick="login()">
            Entra
        </button>

    </div>

    <!-- CONTENUTO APPLICAZIONE -->
    <div id="appContent" style="display: none;">

        <h1>Gestionale Area41</h1>

        <div class="top-bar">
            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>

        <!-- HOME -->
        <div id="home" class="pagina attiva">

            <h2>Home</h2>

            <div class="menu-home">
                <button onclick="apriPagina('assistenza')">
                    Assistenza Dispositivi
                </button>

                <button onclick="apriPagina('ordini')">
                    Richieste / Ordini Clienti
                </button>

<button onclick="apriPagina('crediti')">
    Crediti Clienti
</button>

                <button onclick="creaBackup()">
                    Crea Backup
                </button>

                <button onclick="apriPagina('impostazioni')">
                    Impostazioni
                </button>
            </div>

            <h2>Assistenze Attive</h2>
            <div id="riepilogoInterventi"></div>

            <h2>Ordini Attivi</h2>
            <div id="riepilogoOrdini"></div>

<h2>Crediti Attivi</h2>
<div id="riepilogoCrediti"></div>

        </div>

        <!-- ASSISTENZA -->
        <div id="assistenza" class="pagina">

            <button class="back-btn" onclick="apriPagina('home')">
                Torna alla Home
            </button>

            <h2>Assistenza Dispositivi</h2>

            <div class="form-container">

                <input type="text" id="nome" placeholder="Nome Cliente">
                <input type="text" id="telefono" placeholder="Numero Telefono">
                <input type="text" id="dispositivo" placeholder="Dispositivo">
                <input type="text" id="codiceSblocco" placeholder="Codice Sblocco">
                <input type="date" id="data">
                <input type="number" id="prezzo" placeholder="Prezzo">
                <input type="file" id="fotoIntervento" accept="image/*">

                <select id="statoIntervento">
                    <option value="In attesa">In attesa</option>
                    <option value="In lavorazione">In lavorazione</option>
                    <option value="Pronto">Pronto</option>
                    <option value="Consegnato">Consegnato</option>
                    <option value="Annullato">Annullato</option>
                </select>

                <textarea id="note" placeholder="Note"></textarea>

                <button onclick="salvaIntervento()">
                    Salva Intervento
                </button>

            </div>

            <input
                type="text"
                id="ricerca"
                placeholder="Cerca intervento..."
                onkeyup="mostraInterventi()"
            >

            <div id="listaInterventi"></div>

        </div>

        <!-- ORDINI -->
        <div id="ordini" class="pagina">

            <button class="back-btn" onclick="apriPagina('home')">
                Torna alla Home
            </button>

            <h2>Richieste / Ordini Clienti</h2>

            <div class="form-container">

                <input type="text" id="ordineNome" placeholder="Nome Cliente">
                <input type="text" id="ordineTelefono" placeholder="Numero Telefono">
                <input type="text" id="prodottoRichiesto" placeholder="Prodotto Richiesto">
                <input type="text" id="modelloRichiesto" placeholder="Modello / Dettagli">
                <input type="date" id="ordineData">
                <input type="number" id="ordinePrezzo" placeholder="Prezzo Indicativo">
                <input type="number" id="ordineAcconto" placeholder="Acconto">

                <select id="statoOrdine">
                    <option value="Da ordinare">Da ordinare</option>
                    <option value="Ordinato">Ordinato</option>
                    <option value="Arrivato">Arrivato</option>
                    <option value="Consegnato">Consegnato</option>
                    <option value="Annullato">Annullato</option>
                </select>

                <textarea id="ordineNote" placeholder="Note"></textarea>

                <button onclick="salvaOrdine()">
                    Salva Richiesta
                </button>

            </div>

            <input
                type="text"
                id="ricercaOrdini"
                placeholder="Cerca ordine..."
                onkeyup="mostraOrdini()"
            >

            <div id="listaOrdini"></div>

        </div>

        <!-- STORICO CLIENTE -->
        <div id="storicoCliente" class="pagina">

            <button class="back-btn" onclick="apriPagina('home')">
                Torna alla Home
            </button>

            <h2 id="titoloStoricoCliente">Storico Cliente</h2>

            <div id="contenutoStoricoCliente"></div>

        </div>

<!-- CREDITI CLIENTI -->
<div id="crediti" class="pagina">

    <button class="back-btn" onclick="apriPagina('home')">
        Torna alla Home
    </button>

    <h2>Crediti Clienti</h2>

    <div class="form-container">

        <input type="text" id="creditoNome" placeholder="Nome Cliente">
        <input type="text" id="creditoTelefono" placeholder="Numero Telefono">
        <input type="text" id="creditoMotivo" placeholder="Motivo / Descrizione">
        <input type="number" id="creditoImporto" placeholder="Importo Dovuto">
        <input type="number" id="creditoAcconto" placeholder="Acconto Ricevuto">
        <input type="date" id="creditoData">
        <input type="date" id="creditoScadenza">

        <select id="creditoStato">
            <option value="Da incassare">Da incassare</option>
            <option value="Parziale">Parziale</option>
            <option value="Pagato">Pagato</option>
            <option value="Annullato">Annullato</option>
        </select>

        <textarea id="creditoNote" placeholder="Note"></textarea>

        <button onclick="salvaCredito()">
            Salva Credito
        </button>

    </div>

    <input
        type="text"
        id="ricercaCrediti"
        placeholder="Cerca credito..."
        onkeyup="mostraCrediti()"
    >

    <div id="listaCrediti"></div>

</div>

        <!-- IMPOSTAZIONI -->
        <div id="impostazioni" class="pagina">

            <button class="back-btn" onclick="apriPagina('home')">
                Torna alla Home
            </button>

            <h2>Impostazioni</h2>

            <div class="form-container">

                <input
                    type="password"
                    id="vecchiaPassword"
                    placeholder="Vecchia Password"
                >

                <input
                    type="password"
                    id="nuovaPassword"
                    placeholder="Nuova Password"
                >

                <input
                    type="password"
                    id="confermaNuovaPassword"
                    placeholder="Conferma Nuova Password"
                >

                <button onclick="cambiaPassword()">
                    Cambia Password
                </button>

            </div>

            <h2>Backup</h2>

            <div class="form-container">

                <button onclick="caricaListaBackup()">
                    Aggiorna Lista Backup
                </button>

                <div id="listaBackup"></div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
